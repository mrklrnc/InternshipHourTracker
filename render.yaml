services:
  # 1. C# ASP.NET Core Backend API
  - type: web
    name: internship-hours-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MongoDBSettings__ConnectionString
        sync: false

  # 2. React + Vite Static Frontend
  - type: web
    name: internship-hours-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false

